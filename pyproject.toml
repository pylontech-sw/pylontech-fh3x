[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pylontech-fh3x"
version = "0.1.0"
description = "Async Modbus protocol library for Pylontech Force H3X systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pylontech FH3X contributors" }]
dependencies = ["pymodbus==3.13.1"]

[project.urls]
Source = "https://github.com/pylontech-sw/pylontech-fh3x"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

